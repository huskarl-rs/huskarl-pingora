name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out huskarl-pingora
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Check feature combinations
        run: |
          cargo check --no-default-features
          cargo check --no-default-features --features login
          cargo check --no-default-features --features resource
          cargo check --all-features

      - name: Lint all targets
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-features --all-targets

      - name: Run documentation tests
        run: cargo test --doc --all-features

      - name: Build strict documentation for supported feature sets
        run: |
          cargo doc --no-deps --no-default-features
          cargo doc --no-deps --no-default-features --features login
          cargo doc --no-deps --no-default-features --features resource
          cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check generated README
        run: |
          cargo install cargo-reedme --version 0.6.1 --locked
          cargo reedme --check
