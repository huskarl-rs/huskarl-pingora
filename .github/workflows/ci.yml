name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out huskarl-pingora
        uses: actions/checkout@v4
        with:
          path: huskarl-pingora

      # Cargo.toml intentionally uses sibling paths for coordinated local
      # development while retaining published version requirements.
      - name: Check out huskarl
        uses: actions/checkout@v4
        with:
          repository: huskarl-rs/huskarl
          path: huskarl

      - name: Check out huskarl-login
        uses: actions/checkout@v4
        with:
          repository: huskarl-rs/huskarl-login
          path: huskarl-login

      - name: Check out huskarl-route-guard
        uses: actions/checkout@v4
        with:
          repository: huskarl-rs/huskarl-route-guard
          path: huskarl-route-guard

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
        working-directory: huskarl-pingora

      - name: Check feature combinations
        run: |
          cargo check --no-default-features
          cargo check --no-default-features --features login
          cargo check --no-default-features --features resource
          cargo check --all-features
        working-directory: huskarl-pingora

      - name: Lint library
        run: cargo clippy --all-features --lib -- -D warnings
        working-directory: huskarl-pingora

      - name: Run tests
        run: cargo test --all-features --all-targets
        working-directory: huskarl-pingora

      - name: Run documentation tests
        run: cargo test --doc --all-features
        working-directory: huskarl-pingora

      - name: Check generated README
        run: |
          cargo install cargo-reedme --version 0.6.1 --locked
          cargo reedme --check
        working-directory: huskarl-pingora
