[package]
name = "huskarl-pingora"
version = "0.6.0"
edition = "2024"
rust-version = "1.92"
description = "Pingora integration for huskarl OAuth2 resource server."
repository = "https://github.com/huskarl-rs/huskarl-pingora"
homepage = "https://github.com/huskarl-rs/huskarl-pingora"
documentation = "https://docs.rs/huskarl-pingora"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "pingora", "security", "authentication"]
categories = ["authentication"]

[features]
default = ["resource", "login", "default-jws-verifier-platform"]
resource = [
  "dep:bon",
  "dep:huskarl-resource-server",
  "dep:huskarl-route-guard",
  "dep:pingora-core",
  "dep:serde_json",
  "dep:metrics",
  "dep:strum",
]
login = [
  "dep:bon",
  "dep:huskarl",
  "dep:huskarl-login",
  "dep:huskarl-route-guard",
  "dep:pingora-core",
]
default-jws-verifier-platform = [
  "huskarl?/default-jws-verifier-platform",
  "huskarl-resource-server?/default-jws-verifier-platform",
]

[dependencies]
async-trait = "0.1.89"
huskarl-route-guard = { version = "0.1", path = "../huskarl-route-guard", optional = true }
bytes = "1"
http = "1"
log = "0.4"
pingora-proxy-delegate = "0.1"
pingora-error = "0.8"
pingora-http = "0.8"
pingora-proxy = { version = "0.8", default-features = false }
tokio = { version = "1", features = ["sync"] }

# resource feature
bon = { version = "3.9", optional = true }
huskarl-resource-server = { version = "0.10", path = "../huskarl/huskarl-resource-server", default-features = false, optional = true }
pingora-core = { version = "0.8", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
metrics = { version = "0.24", default-features = false, optional = true }
strum = { version = "0.27", default-features = false, features = ["derive"], optional = true }

# login feature
huskarl = { version = "0.10", default-features = false, optional = true }
huskarl-login = { version = "0.3", path = "../huskarl-login", optional = true }
pingora-cache = "0.8.0"

[dev-dependencies]
huskarl-resource-server = { version = "0.10", path = "../huskarl/huskarl-resource-server" }
huskarl-reqwest = { version = "0.8", features = ["rustls-tls"] }
huskarl-crypto-native = { version = "0.10" }
hex = "0.4"
pingora-core = { version = "0.8", features = ["rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
env_logger = "0.11"
rand = "0.10"
uuid = "1"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }

[[example]]
name = "jwt_proxy"
required-features = ["resource"]

[[example]]
name = "login_proxy"
required-features = ["login"]

[package.metadata.cargo-machete]
ignored = ["pingora-cache"]
