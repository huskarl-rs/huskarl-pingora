[package]
name = "huskarl-pingora"
version = "0.6.0"
edition = "2024"
rust-version = "1.92"
description = "Pingora integration for huskarl OAuth2 resource server."
repository = "https://github.com/huskarl-rs/huskarl-pingora"
homepage = "https://github.com/huskarl-rs/huskarl-pingora"
documentation = "https://docs.rs/huskarl-pingora"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "pingora", "security", "authentication"]
categories = ["authentication"]

[features]
default = ["resource", "login", "default-jws-verifier-platform"]
upstream_modules = [
  "pingora-proxy/upstream_modules",
  "pingora-proxy-delegate/upstream_modules",
  "pingora-proxy-router/upstream_modules",
]
resource = [
  "dep:bon",
  "dep:bytes",
  "dep:huskarl-resource-server",
  "dep:huskarl-route-guard",
  "dep:pingora-core",
  "dep:serde_json",
  "dep:metrics",
  "dep:strum",
]
login = [
  "dep:bon",
  "dep:bytes",
  "dep:huskarl",
  "dep:huskarl-login",
  "dep:huskarl-route-guard",
  "dep:pingora-core",
]
default-jws-verifier-platform = [
  "huskarl?/default-jws-verifier-platform",
  "huskarl-resource-server?/default-jws-verifier-platform",
]

[dependencies]
# Referenced by code generated by `pingora-proxy-delegate`; keep these as
# normal direct dependencies even when they are not named in handwritten code.
async-trait = "0.1.89"
huskarl-route-guard = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
http = "1"
log = "0.4"
pingora-proxy-delegate = { version = "0.2", default-features = false }
pingora-error = "0.9"
pingora-http = "0.9"
pingora-proxy = { version = "0.9", default-features = false }
pingora-cache = "0.9"
tokio = { version = "1", features = ["sync"] }

# resource feature
bon = { version = "3.9", optional = true }
huskarl-resource-server = { version = "0.11", path = "../huskarl/huskarl-resource-server", default-features = false, optional = true }
pingora-core = { version = "0.9", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
metrics = { version = "0.24", default-features = false, optional = true }
strum = { version = "0.28", default-features = false, features = ["derive"], optional = true }

# login feature
huskarl = { version = "0.11", path = "../huskarl/huskarl", default-features = false, optional = true }
huskarl-login = { version = "0.3", path = "../huskarl-login", optional = true }

[dev-dependencies]
h2 = "0.4"
huskarl-login = { version = "0.3", path = "../huskarl-login", features = ["test-support"] }
huskarl-resource-server = { version = "0.11", path = "../huskarl/huskarl-resource-server" }
huskarl-reqwest = { version = "0.9", path = "../huskarl/huskarl-reqwest", features = ["rustls-tls"] }
huskarl-crypto-native = { version = "0.11", path = "../huskarl/huskarl-crypto-native" }
hex = "0.4"
pingora-core = { version = "0.9", features = ["rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util"] }
url = "2"
env_logger = "0.11"
rand = "0.10"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
pingora-proxy-router = { version = "0.1", default-features = false }

[[example]]
name = "jwt_proxy"
required-features = ["resource"]

[[example]]
name = "multi_resource_proxy"
required-features = ["resource"]

[[example]]
name = "login_proxy"
required-features = ["login"]

[package.metadata.cargo-machete]
# These are referenced by `proxy_http_delegate!` expansion, which machete
# cannot see in the source syntax.
ignored = ["pingora-cache"]
